<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>一歩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap">
<style>
/* Layout: one phone-width column (max 480px): top bar, scrolling screen, bottom tab bar.
   Quiz sessions and bottom sheets are layers that cover the same column. */
:root{
  /* 메인 #172B4D · 배경 #F5F1E8 · 포인트 #D6AD60 · 카드 #FFFFFF · 보조 텍스트 #788390 */
  --outer:#e8e2d2; --bg:#f5f1e8; --surface:#ffffff; --surface-2:#ede7d9; --line:#e2dbc9;
  --fg:#172b4d; --fg-2:#788390;
  --accent:#172b4d; --accent-ink:#ffffff; --accent-soft:#f3e7c8; --accent-text:#172b4d;
  --point:#d6ad60; --point-ink:#172b4d; --point-text:#8a6414; --mark:rgba(214,173,96,.5);
  --mem-bg:#fbf4df; --mem-line:#e3c57f;
  --good:#1f7a5a; --good-soft:#e1f1e7; --bad:#b83a50; --bad-soft:#f8e3df; --bad-ink:#ffffff;
  --hint-bg:#fbf3dc; --hint-line:#e3cf98; --ruby:#5f6b7c;
  --ghost:rgba(23,43,77,.12); --ghost-strong:rgba(23,43,77,.34);
  --shadow:rgba(23,43,77,.14); --scrim:rgba(12,24,48,.5);
  --font-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-kanji:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Noto Serif KR",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --outer:#0a1428; --bg:#0f1d36; --surface:#172845; --surface-2:#1f3354; --line:#2a3f63;
    --fg:#f5f1e8; --fg-2:#9aa6ba;
    --accent:#d6ad60; --accent-ink:#172b4d; --accent-soft:#27385a; --accent-text:#e4c27c;
    --point:#d6ad60; --point-ink:#172b4d; --point-text:#e4c27c; --mark:rgba(214,173,96,.34);
    --mem-bg:#1d2e4d; --mem-line:#6d5d36;
    --good:#5fd3a8; --good-soft:#173a30; --bad:#ff8ea3; --bad-soft:#40202a; --bad-ink:#2a0f16;
    --hint-bg:#2a3040; --hint-line:#5e5326; --ruby:#b4bfd1;
    --ghost:rgba(245,241,232,.12); --ghost-strong:rgba(245,241,232,.38);
    --shadow:rgba(0,0,0,.35); --scrim:rgba(4,10,24,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --outer:#0a1428; --bg:#0f1d36; --surface:#172845; --surface-2:#1f3354; --line:#2a3f63;
  --fg:#f5f1e8; --fg-2:#9aa6ba;
  --accent:#d6ad60; --accent-ink:#172b4d; --accent-soft:#27385a; --accent-text:#e4c27c;
  --point:#d6ad60; --point-ink:#172b4d; --point-text:#e4c27c; --mark:rgba(214,173,96,.34);
  --mem-bg:#1d2e4d; --mem-line:#6d5d36;
  --good:#5fd3a8; --good-soft:#173a30; --bad:#ff8ea3; --bad-soft:#40202a; --bad-ink:#2a0f16;
  --hint-bg:#2a3040; --hint-line:#5e5326; --ruby:#b4bfd1;
  --ghost:rgba(245,241,232,.12); --ghost-strong:rgba(245,241,232,.38);
  --shadow:rgba(0,0,0,.35); --scrim:rgba(4,10,24,.62);
  color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45;overflow:hidden;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,p{margin:0}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#app{position:relative;max-width:480px;height:100%;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:14px}

.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;min-height:54px;gap:8px}
.topbar h1{flex:1;text-align:center;font-size:18px;font-weight:700;letter-spacing:-.01em}
.side{width:72px;display:flex;align-items:center;justify-content:flex-end}
.side:first-child{justify-content:flex-start}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn:active{background:var(--accent-soft)}
/* sun / moon switch (top-left) */
.themesw{position:relative;flex:none;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;width:68px;height:38px;padding:0 3px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.themesw .th{position:absolute;left:3px;top:3px;width:30px;height:30px;border-radius:50%;background:var(--accent);box-shadow:0 1px 3px var(--shadow);transition:transform .26s cubic-bezier(.3,.8,.3,1)}
.themesw[aria-checked="true"] .th{transform:translateX(30px)}
.themesw .sun,.themesw .moon{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;transition:color .2s}
.themesw .sun{color:var(--accent-ink)}
.themesw[aria-checked="true"] .sun{color:var(--fg-2)}
.themesw[aria-checked="true"] .moon{color:var(--accent-ink)}

.bookbar{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text)}
.bookbar .nm{flex:1;min-width:0;text-align:left;font-weight:700;font-size:16px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bookbar .cnt{font-variant-numeric:tabular-nums;color:var(--fg-2);font-size:15px}
.bookbar .cnt b{color:var(--accent-text);font-size:18px}
.filters{padding-top:10px;padding-bottom:10px;flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:34px;padding:0 8px;border-radius:9px;font-size:13px;color:var(--fg-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 3px var(--shadow)}

.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.kcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;aspect-ratio:3/3.7;min-width:0;padding:6px 2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.kcard:active{transform:scale(.97)}
.kcard .kj{font-family:var(--font-kanji);font-weight:700;font-size:clamp(24px,8vw,36px);line-height:1}
.kcard .lb{max-width:100%;padding:0 2px;font-size:clamp(9.5px,2.9vw,12px);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard.mem{background:var(--mem-bg);border-color:var(--mem-line)}
.kcard .v{position:absolute;top:5px;right:5px;width:17px;height:17px;border-radius:50%;background:var(--point);color:var(--point-ink);display:grid;place-items:center}

.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:48px 12px;color:var(--fg-2)}
.empty .kj{font-family:var(--font-kanji);font-weight:700;font-size:56px;color:var(--point);line-height:1}

.actions{flex:none;display:flex;gap:8px;padding-top:10px;padding-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap}
.btn:active{filter:brightness(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700;font-size:16px}
.btn.danger{background:var(--bad);color:var(--bad-ink);border-color:transparent;font-weight:700}
.btn.wide{width:100%}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.actions .btn{flex:1}
.actions .btn.primary{flex:1.5}
.row{display:flex;gap:8px}
.row>.btn{flex:1}

.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:8px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--fg-2)}
.nav button[aria-current="page"]{position:relative;color:var(--accent-text);font-weight:700}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-6px;left:50%;width:28px;height:3px;margin-left:-14px;border-radius:0 0 3px 3px;background:var(--point)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.prow{display:flex;flex-direction:column;gap:6px}
.prow>label,.prow>.lab{font-size:12px;font-weight:500;color:var(--fg-2)}
.ctx{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:13px;padding:2px 2px 12px}
.ctx b{color:var(--fg)}
.muted{color:var(--fg-2);font-size:13px}
.modecard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.modecard:active{background:var(--accent-soft)}
.flow{display:flex;align-items:center;gap:6px;flex:none;color:var(--fg-2)}
.tile{min-width:54px;height:54px;padding:0 8px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:700;font-size:13px;text-align:center;line-height:1.2}
.tile.kj{font-family:var(--font-kanji);font-size:30px}
.modecard .tx{flex:1;min-width:0}
.modecard .tx b{display:block;font-size:16px}
.modecard .tx span{font-size:13px;color:var(--fg-2)}
.badge{flex:none;font-size:12px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:99px;padding:4px 10px;font-variant-numeric:tabular-nums}

.bookrow{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 6px 8px 8px;margin-bottom:10px}
.bookrow.on{border-color:var(--point);box-shadow:0 0 0 1px var(--point)}
.bmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:4px}
.bico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none}
.binfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.binfo b{display:flex;align-items:center;min-width:0}
.binfo .bn{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.binfo small{color:var(--fg-2);font-size:12px;font-variant-numeric:tabular-nums}
.bar{display:block;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pill{flex:none;white-space:nowrap;font-size:11px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}

.setrow{display:flex;flex-direction:column;gap:8px}
.setrow h3{margin:0;font-size:15px}
.setrow p{font-size:13px;color:var(--fg-2)}

/* selection mode (long-press) + copied-kanji bar */
.kcard .ck{display:none;position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--fg-2);background:var(--surface);color:transparent;place-items:center}
.selmode .kcard .ck{display:grid}
.selmode .kcard{padding-top:9px;padding-bottom:3px}
.kcard.sel{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.kcard.sel .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kcard.holding{transform:scale(.93);transition:transform .3s ease-out}
.selmode #nav{display:none}
.selmode .topbar{background:var(--accent-soft)}
.selmode .bookbar,.selmode .filters{opacity:.5}
.bookbar[disabled],.seg button[disabled],.chip[disabled]{cursor:default}
.selbar{flex:none;display:flex;gap:8px;padding-top:10px;padding-bottom:12px;background:var(--surface);border-top:1px solid var(--line)}
.selbar .btn{flex:1}
.selbar .btn.primary{flex:1.3}
.selbar .btn.warn{color:var(--bad)}
.clipbar{flex:none;padding-bottom:10px}
.clipbar .cb{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 12px;border-radius:16px;background:var(--mem-bg);border:1px dashed var(--mem-line)}
.clipbar .ci{flex:none;display:grid;place-items:center;color:var(--point-text)}
.clipbar .ct{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.clipbar .ct b{font-size:14px}
.clipbar .ct small{font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clipbar .ct small.kj{font-family:var(--font-kanji);font-weight:700;font-size:14px;letter-spacing:.1em;color:var(--fg)}
.clipbar .iconbtn{width:34px;height:34px;color:var(--fg-2)}

/* sheets */
.backdrop{position:absolute;inset:0;background:var(--scrim);z-index:30;opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;z-index:31;transform:translateY(100%);transition:transform .25s ease;padding-bottom:12px;box-shadow:0 -8px 30px var(--shadow)}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.sheet-head h2{font-size:17px;font-weight:700}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:10px}
.sheet-foot{flex:none;padding-top:8px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:500;color:var(--fg-2)}
.inp{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px}
textarea.inp{min-height:110px;line-height:1.6;resize:vertical}
.inp.big{font-family:var(--font-kanji);font-weight:700;font-size:28px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow{display:flex;align-items:flex-start;gap:12px;padding:12px 10px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--surface)}
.frow.on{border-color:var(--point);background:var(--mem-bg)}
.frow.miss{opacity:.85}
.fchk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:6px;color:var(--accent-ink)}
.frow.on .fchk{background:var(--accent);border-color:var(--accent)}
.fchk[disabled]{opacity:.4;cursor:default}
.fkj{font-family:var(--font-kanji);font-weight:700;font-size:40px;line-height:1.1;min-width:48px;text-align:center}
.finfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.finfo b{font-size:16px}
.fw{font-size:13px;color:var(--fg-2);line-height:1.55}
.fsm{font-size:12px;color:var(--fg-2)}
.busy{display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 8px;text-align:center;color:var(--fg-2)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sortrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.sortrow .lab{font-size:12px;color:var(--fg-2);margin-right:2px}
.sortrow .chip{min-height:32px;padding:0 12px}
.nrow{display:flex;align-items:center;gap:8px}
.nrow .inp{flex:1;min-height:44px}
.tip{text-align:center;padding:14px 0 2px}
.hwpanel{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;padding:12px;border:1px dashed var(--line);border-radius:16px;background:var(--bg)}
.hwc .chip{min-height:46px;padding:0 14px}
.hwc .chip .kj{font-size:28px}
/* 사진으로 찾기: 사진 → 인식한 문장 → 한자 터치 */
.camimg{display:block;width:100%;max-height:190px;object-fit:contain;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.ocr{display:flex;flex-direction:column;gap:2px;padding:10px 12px;margin-top:10px;border:1px solid var(--line);border-radius:16px;background:var(--bg);font-family:var(--font-kanji);font-size:21px;line-height:1.95}
.ocr .ln{word-break:break-all}
.ocr .tx{color:var(--fg-2);font-size:18px}
.ocr .kb{display:inline-block;min-width:1.3em;margin:1px;padding:0 2px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--font-kanji);font-weight:700;font-size:21px;line-height:1.45;text-align:center;vertical-align:baseline}
.ocr .kb.have{background:var(--mem-bg);border-color:var(--mem-line)}
.ocr .kb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.legend{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--fg-2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--mem-bg);border:1.5px solid var(--mem-line)}
.campk{margin-top:12px}
.campk .frow{margin:0}
.campk .two{margin-top:4px}
.campk .field{margin-bottom:4px}
.err{min-height:20px;margin:-4px 0 8px;font-size:13px;color:var(--bad);font-weight:500}
.help{font-size:12px;color:var(--fg-2);margin-top:-2px}

.dhead{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 14px}
.dhead .kbig{font-family:var(--font-kanji);font-weight:700;font-size:96px;line-height:1.05}
.dhead .mo{font-size:20px;font-weight:700}
.dhead .mo span{color:var(--point-text)}
.words{display:flex;flex-direction:column;gap:2px}
.hw{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.hw:first-child{border-top:0}
.hw .w{font-family:var(--font-kanji);font-weight:700;font-size:20px}
.hw .r{font-size:13px;color:var(--fg-2)}
.hw .w ruby{ruby-align:center;ruby-position:over}
.hw .w rt,.fw rt{font-family:var(--font-ui);font-weight:500;font-size:11px;line-height:1.1;letter-spacing:.02em;color:var(--ruby)}
.fw rt{font-size:10px}
.rdhint{margin:8px 0 2px;font-size:12px}
.hw .m{font-size:14px}
mark.hl{background:linear-gradient(transparent 58%,var(--mark) 58%);color:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--point);color:var(--accent-text);font-weight:700}
.chip .kj{font-family:var(--font-kanji);font-weight:700;font-size:18px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
.stat3 div{background:var(--surface-2);border-radius:14px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat3 span{font-size:12px;color:var(--fg-2)}

/* quiz session */
.ses{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.ses-top{flex:none;display:flex;align-items:center;gap:10px;min-height:54px}
.prog{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.pcount{font-size:13px;color:var(--fg-2);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.ses-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-top:6px;padding-bottom:14px}
.ses-foot{flex:none;display:flex;gap:8px;padding-top:10px;padding-bottom:12px;background:var(--bg);border-top:1px solid var(--line)}
.ses-foot .btn{flex:1}
.ses-foot .btn.primary{flex:1.6}
.bigcard{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 12px}
.bigcard .kbig{font-family:var(--font-kanji);font-weight:700;font-size:clamp(96px,32vw,150px);line-height:1}
.bigcard .kq,.bigcard .wl{font-size:13px;color:var(--fg-2)}
.wrow{display:flex;align-items:baseline;gap:12px}
.wrow .mq{font-size:30px;font-weight:700;letter-spacing:-.01em}
.wrow .oq{font-size:24px;font-weight:700;color:var(--point-text)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:16px}
.choice:active{background:var(--accent-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:700}
.hint{background:var(--hint-bg);border:1px dashed var(--hint-line);border-radius:14px;padding:6px 12px}
.resbox{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid}
.resbox.good{background:var(--good-soft);border-color:var(--good)}
.resbox.bad{background:var(--bad-soft);border-color:var(--bad)}
.resbox .rt{display:flex;align-items:center;gap:8px;font-weight:700}
.resbox.good .rt{color:var(--good)}
.resbox.bad .rt{color:var(--bad)}
.resbox .ra{display:flex;align-items:center;gap:14px}
.resbox .ra .kj{font-family:var(--font-kanji);font-weight:700;font-size:54px;line-height:1}
.resbox .am{font-size:20px;font-weight:700}
.resbox .ao{font-size:17px;font-weight:700;color:var(--point-text)}
.resbox .mine{font-size:13px;color:var(--fg-2)}
.resbox .words{background:var(--surface);border-radius:12px;padding:2px 12px}
.resbox .btn.small{align-self:flex-start}
.cvwrap{position:relative;flex:none;width:min(100%,360px);aspect-ratio:1;margin:0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tools{flex:none;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.score{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent-text)}
.score small{font-size:28px;color:var(--fg-2)}
.center{align-items:center;text-align:center}

.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,12px);width:max-content;max-width:calc(100% - 32px);word-break:keep-all;z-index:40;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;box-shadow:0 0 0 2px var(--bg),0 6px 18px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- 一歩 splash ---------- */
.splash{position:fixed;inset:0;z-index:300;display:flex;justify-content:center;background:var(--outer);transition:opacity .55s ease;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.splash .sp-col{position:relative;width:100%;max-width:480px;height:100%;background:var(--bg);overflow:hidden;transition:transform .55s cubic-bezier(.2,.65,.2,1)}
.splash canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.splash.out{opacity:0;pointer-events:none}
.splash.out .sp-col{transform:scale(1.04)}
.splash.fast,.splash.fast .sp-col{transition-duration:.28s}
@keyframes appin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
#app.appin{animation:appin .6s cubic-bezier(.2,.7,.2,1) both}
</style>

<div id="app">
  <main id="main"></main>
  <nav class="nav gx" id="nav" aria-label="주요 메뉴"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
const alts=s=>String(s||'').split(/[\/,;·]/).map(norm).filter(Boolean);
const matchField=(input,truth)=>{const n=norm(input);return !!n&&(alts(truth).includes(n)||norm(truth)===n);};
const KANA=/^[぀-ヿー・]+$/;
const KFONT='"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif';
const IC={
  plus:'<path d="M12 5v14M5 12h14"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  chevD:'<path d="m6 9 6 6 6-6"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  shuffle:'<path d="M16 4h4v4M20 4 4 20M20 16v4h-4M15 15l5 5M4 4l5 5"/>',
  play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor" stroke="none"/>',
  chart:'<path d="M5 20V11M12 20V5M19 20v-7"/>',
  home:'<path d="M4 11.5 12 4l8 7.5V20h-5v-5H9v5H4z"/>',
  book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/>',
  quiz:'<rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4.5h6M9 13l2.2 2.2L15.5 10.8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="currentColor" stroke="none"/>',
  edit:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>',
  trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
  sun:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/>',
  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 9V6.5A2.5 2.5 0 0 0 12.5 4h-6A2.5 2.5 0 0 0 4 6.5v6A2.5 2.5 0 0 0 6.5 15H9"/>'
};
const ic=(n,s=20,sw=2)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- data ---------- */
function parseWord(line){
  line=String(line||'').trim(); if(!line) return null;
  const parts=line.includes('|')?line.split('|').map(s=>s.trim()).filter(Boolean):line.split(/\s+/);
  const w=parts[0]; let r='',m='';
  if(parts.length===2){ if(KANA.test(parts[1])) r=parts[1]; else m=parts[1]; }
  else if(parts.length>2){ if(KANA.test(parts[1])){ r=parts[1]; m=parts.slice(2).join(' ');} else { m=parts.slice(1).join(' ');} }
  return {w,r,m};
}
const wordsToText=ws=>(ws||[]).map(x=>x.w).join('\n');
const MIG=new Set();
const BOOK_NAME='국비유학 준비 한자 단어장';
function cleanBook(b){
  const o={
    id:String(b&&b.id||uid()),
    name:String(b&&b.name||'단어장').slice(0,30),
    u:+(b&&b.u)||0,
    kanji:(Array.isArray(b&&b.kanji)?b.kanji:[]).filter(k=>k&&k.ch).map(k=>({
      id:String(k.id||uid()),ch:[...String(k.ch)][0],mean:String(k.mean||'').slice(0,40),on:String(k.on||'').slice(0,20),
      words:(Array.isArray(k.words)?k.words:[]).filter(w=>w&&w.w).slice(0,20).map(w=>({w:String(w.w).slice(0,20),r:String(w.r||'').slice(0,30),m:String(w.m||'').slice(0,40)})),
      mem:k.mem?1:0,ok:+k.ok||0,ng:+k.ng||0,st:+k.st||0
    }))
  };
  /* 예전 예시 한자(s0~s22)를 지우고 이름을 바꿔요. 직접 등록한 한자는 그대로 둬요. */
  if(o.id==='n1'){
    const n=o.kanji.length; o.kanji=o.kanji.filter(k=>!/^s\d{1,2}$/.test(k.id));
    let ch=o.kanji.length!==n;
    if(o.name==='N1 필수 한자'){o.name=BOOK_NAME;ch=true;}
    if(ch){o.u=Date.now();MIG.add(o.id);}
  }
  return o;
}
const seedBook=()=>({id:'n1',name:BOOK_NAME,u:0,kanji:[]});

const LSK='kj_state_v1',PRK='kj_prefs_v1';
let S={books:[],active:null};
let prefs={auto:3,sort:'old',theme:'light',qs:{scope:'todo',n:10,shuffle:true,input:'choice'}};
let ui={tab:'home',filter:'all',shuffle:false,order:null};
let sel={on:false,bid:null,ids:new Set()};   /* 꾹 눌러 시작하는 선택 모드 */
let clip=null;                               /* 복사해 둔 한자 → 다른 단어장에 붙여넣기 */
let sync='local';
try{const p=JSON.parse(localStorage.getItem(PRK)||'null');if(p){if(typeof p.auto==='number')prefs.auto=p.auto;if(['old','recent','abc'].includes(p.sort))prefs.sort=p.sort;if(p.theme==='dark'||p.theme==='light')prefs.theme=p.theme;Object.assign(prefs.qs,p.qs||{});}}catch(e){}
const savePrefs=()=>{try{localStorage.setItem(PRK,JSON.stringify(prefs));}catch(e){}};
const lsSet=()=>{try{localStorage.setItem(LSK,JSON.stringify({books:S.books,active:S.active}));}catch(e){}};
const curBook=()=>S.books.find(b=>b.id===S.active)||S.books[0];
const findK=(bid,kid)=>{const b=S.books.find(x=>x.id===bid);return b&&b.kanji.find(k=>k.id===kid);};
const label=k=>`${k.mean} ${k.on}`.trim();
const CLK='kj_clip_v1';
const saveClip=()=>{try{if(clip)localStorage.setItem(CLK,JSON.stringify(clip));else localStorage.removeItem(CLK);}catch(e){}};
try{
  const c=JSON.parse(localStorage.getItem(CLK)||'null');
  if(c&&Array.isArray(c.items)){
    const items=cleanBook({id:'clip',name:'x',kanji:c.items}).kanji.map(k=>{const o=Object.assign({},k);delete o.id;return o;});
    if(items.length) clip={from:String(c.from||''),name:String(c.name||'').slice(0,30),items};
  }
}catch(e){}

/* ---------- 화이트 / 다크 모드: 왼쪽 위 해·달 스위치. 처음엔 화이트(기본 색)로 시작하고, 고른 모드를 기억해요. ---------- */
const Theme=(function(){
  const root=document.documentElement;
  let mode='light',fights=0;
  const actual=()=>{const a=root.getAttribute('data-theme'); return a?a:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');};
  function paint(){
    root.setAttribute('data-theme',mode); root.style.colorScheme=mode;
    $$('.themesw').forEach(b=>b.setAttribute('aria-checked',String(actual()==='dark')));
  }
  function set(m,save){
    mode=m==='dark'?'dark':'light'; fights=0; paint();
    if(save){prefs.theme=mode;savePrefs();}
  }
  function init(){
    set(prefs.theme,false);
    /* 바깥에서 data-theme를 바꿔도 내가 고른 모드를 지켜요 (서로 계속 되돌리지 않게 3번까지만) */
    try{ new MutationObserver(()=>{ if(root.getAttribute('data-theme')!==mode&&fights<3){fights++;paint();} }).observe(root,{attributes:true,attributeFilter:['data-theme']}); }catch(e){}
  }
  const markup=()=>`<button class="themesw" data-act="theme" role="switch" aria-checked="${actual()==='dark'}" aria-label="다크 모드"><span class="th"></span><span class="sun">${ic('sun',17,2.2)}</span><span class="moon">${ic('moon',17,2.2)}</span></button>`;
  return {init,markup,toggle(){set(actual()==='dark'?'light':'dark',true);}};
})();
Theme.init();

/* ---------- persistence: local copy + private cloud store (db) ---------- */
let booksRef=null,dirty=new Set(),saveTimer=null,flushing=false,again=false;
function persist(id){
  const b=S.books.find(x=>x.id===id); if(b) b.u=Date.now();
  dirty.add(id); lsSet(); clearTimeout(saveTimer); saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(!booksRef) return;
  if(flushing){again=true;return;}
  flushing=true;
  for(const id of [...dirty]){
    const b=S.books.find(x=>x.id===id);
    if(!b){dirty.delete(id);continue;}
    try{ await booksRef.doc(id).set({id:b.id,name:b.name,u:b.u,kanji:b.kanji}); dirty.delete(id); sync='ok'; }
    catch(e){ sync=(e&&e.code==='invalid_argument')?'local':'error'; if(sync==='local')booksRef=null; break; }
  }
  flushing=false;
  if(again){again=false;flush();}
  if(ui.tab==='settings')render();
}
function dropRemote(id){ if(booksRef){ booksRef.doc(id).delete().catch(()=>{}); } dirty.delete(id); }
function onRemote(snap){
  if(snap.metadata.hasPendingWrites) return;
  const remote=[]; snap.docs.forEach(d=>{const x=d.data(); if(x&&Array.isArray(x.kanji)) remote.push(cleanBook(Object.assign({},x,{id:d.id})));});
  const definitive=!snap.metadata.fromCache;
  if(!remote.length){
    if(!definitive) return;
    S.books.forEach(b=>dirty.add(b.id)); sync='ok'; flush(); return;
  }
  remote.forEach(r=>{
    const i=S.books.findIndex(b=>b.id===r.id);
    if(i<0) S.books.push(r);
    else if(!dirty.has(r.id)){ if(r.u>=S.books[i].u) S.books[i]=r; else dirty.add(r.id); }
  });
  MIG.forEach(id=>dirty.add(id)); MIG.clear();
  if(definitive){ S.books.forEach(b=>{ if(!remote.find(r=>r.id===b.id)) dirty.add(b.id); }); sync='ok'; }
  if(!S.books.find(b=>b.id===S.active)) S.active=S.books[0].id;
  lsSet(); render(); if(dirty.size) flush();
}
async function initRemote(){
  try{
    if(!(window.claude&&window.claude.use)) return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    booksRef=db.doc('data/users/'+id+'/app').collection('books');
    const t=setTimeout(()=>{ if(sync!=='ok'){sync='slow'; if(ui.tab==='settings')render();} },10000);
    booksRef.onSnapshot(s=>{clearTimeout(t);onRemote(s);},()=>{clearTimeout(t);booksRef=null;sync='local';if(ui.tab==='settings')render();});
  }catch(e){ booksRef=null; }
}
const syncText=()=>({
  local:'이 기기(브라우저)에만 저장돼요.',
  ok:'내 계정의 비공개 저장소에 자동으로 저장돼요.',
  slow:'저장소 응답이 느려요. 연결되면 자동으로 저장됩니다.',
  error:'클라우드 저장에 실패했어요. 이 기기에는 저장돼 있고, 다시 시도해요.'
}[sync]);

/* ---------- toast & sheets ---------- */
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2300);}
let sheet=null;
function openSheet(build){
  closeSheet(true);
  const app=$('#app'),bd=document.createElement('div'),el=document.createElement('section');
  bd.className='backdrop'; bd.dataset.act='close-sheet';
  el.className='sheet'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  app.append(bd,el); sheet={bd,el,build}; fillSheet();
  requestAnimationFrame(()=>{bd.style.opacity=1;el.style.transform='none';});
}
function fillSheet(){
  if(!sheet) return;
  const sb0=$('.sheet-body',sheet.el),top0=sb0?sb0.scrollTop:0;
  const o=sheet.build(); sheet.el.setAttribute('aria-label',o.title);
  sheet.el.innerHTML=`<div class="sheet-head gx"><h2>${esc(o.title)}</h2><button class="iconbtn" data-act="close-sheet" aria-label="닫기">${ic('close',20)}</button></div><div class="sheet-body gx">${o.body}</div>${o.foot?`<div class="sheet-foot gx">${o.foot}</div>`:''}`;
  const sb1=$('.sheet-body',sheet.el); if(sb1&&top0) sb1.scrollTop=top0;
  if(o.mount) o.mount(sheet.el);
}
function closeSheet(instant){
  if(!sheet) return; const s=sheet; sheet=null;
  if(fctx&&fctx.busy&&fctx.ctl){try{fctx.ctl.abort();}catch(_){}}
  if(fctx&&fctx.hwp){try{fctx.hwp.destroy();}catch(_){} fctx.hwp=null;}
  if(fctx&&fctx.cam){const c=fctx.cam; fctx.cam=null; try{if(c.ctl)c.ctl.abort();}catch(_){} try{URL.revokeObjectURL(c.url);}catch(_){}}
  if(instant){s.bd.remove();s.el.remove();return;}
  s.bd.style.opacity=0; s.el.style.transform='translateY(100%)';
  setTimeout(()=>{s.bd.remove();s.el.remove();},230);
}
function confirmSheet(title,msg,okLabel,onOk){
  openSheet(()=>({title,body:`<p class="muted" style="padding:2px 0 10px">${esc(msg)}</p>`,
    foot:`<div class="row"><button class="btn" data-act="close-sheet">취소</button><button class="btn danger" id="cf-ok">${esc(okLabel)}</button></div>`,
    mount:el=>$('#cf-ok',el).addEventListener('click',()=>{closeSheet();onOk();})}));
}
let pctx=null;
function promptSheet(title,lab,val,okLabel,onOk){
  pctx={onOk};
  openSheet(()=>({title,body:`<form id="pform" class="field"><label for="p-in">${esc(lab)}</label><input class="inp" id="p-in" maxlength="30" value="${esc(val)}" autocomplete="off"></form>`,
    foot:`<button class="btn primary wide" type="submit" form="pform">${esc(okLabel)}</button>`,
    mount:el=>setTimeout(()=>{const i=$('#p-in',el);if(i){i.focus();i.select();}},260)}));
}

/* ---------- screens ---------- */
const header=(title,right='',hid='')=>`<header class="topbar gx"><span class="side">${Theme.markup()}</span><h1${hid?` id="${hid}" aria-live="polite"`:''}>${esc(title)}</h1><span class="side">${right}</span></header>`;
function visible(b){
  let ks=b.kanji.slice();
  if(ui.filter==='todo') ks=ks.filter(k=>!k.mem); else if(ui.filter==='done') ks=ks.filter(k=>k.mem);
  if(!ui.shuffle){ if(prefs.sort==='recent') ks.reverse(); else if(prefs.sort==='abc') ks.sort((a,c)=>a.mean.localeCompare(c.mean,'ko')||a.on.localeCompare(c.on,'ko')); }
  if(ui.shuffle&&ui.order){const pos=new Map(ui.order.map((id,i)=>[id,i]));ks.sort((a,c)=>(pos.has(a.id)?pos.get(a.id):1e9)-(pos.has(c.id)?pos.get(c.id):1e9));}
  return ks;
}
const card=k=>{const on=sel.on&&sel.ids.has(k.id);return `<button class="kcard${k.mem?' mem':''}${on?' sel':''}" data-act="card" data-id="${esc(k.id)}"${sel.on?` aria-pressed="${on}"`:''} aria-label="${esc(k.ch)} ${esc(label(k))}${k.mem?', 암기 완료':''}">${sel.on?`<span class="ck">${ic('check',10,3.8)}</span>`:''}${k.mem?`<span class="v">${ic('check',11,3.2)}</span>`:''}<span class="kj" lang="ja">${esc(k.ch)}</span><span class="lb">${esc(label(k))}</span></button>`;};

const selTitle=()=>sel.ids.size?`${sel.ids.size}개 선택`:'한자를 선택하세요';
function clipInfo(b){
  if(!clip||!clip.items.length) return null;
  const have=new Set(b.kanji.map(k=>k.ch)),seen=new Set(); let add=0;
  clip.items.forEach(k=>{ if(!have.has(k.ch)&&!seen.has(k.ch)){seen.add(k.ch);add++;} });
  return {total:clip.items.length,add,dup:clip.items.length-add};
}
function clipBar(b){
  const c=clipInfo(b); if(!c||!c.add||sel.on) return '';
  const pv=clip.items.slice(0,8).map(k=>k.ch).join(' ')+(clip.items.length>8?' …':'');
  const sub=`<small class="kj" lang="ja">${esc(pv)}</small>${c.dup?`<small>이미 있는 ${c.dup}개는 제외</small>`:''}`;
  return `<div class="clipbar gx"><div class="cb"><span class="ci">${ic('copy',20)}</span><span class="ct"><b>복사한 한자 ${c.total}개</b>${sub}</span><button class="btn small primary" data-act="paste">붙여넣기</button><button class="iconbtn" data-act="clip-clear" aria-label="복사한 한자 비우기">${ic('close',18)}</button></div></div>`;

function parseQueries(text){
  const lines=text.split('\n').map(s=>s.trim()).filter(Boolean),out=[];
  for(let i=0;i<lines.length;i++){
    const p=lines[i].split(/\s+/);
    if(p.length<2) return {err:`${i+1}번째 줄: 뜻과 음을 띄어 써 주세요. 예) 불 화`};
    out.push({q:lines[i],mean:p.slice(0,-1).join(' '),on:p[p.length-1]});
  }
  if(!out.length) return {err:'뜻과 음을 한 줄에 하나씩 입력하세요.'};
  if(out.length>20) return {err:'한 번에 20줄까지 찾을 수 있어요.'};
  return {list:out};
}

const findPrompt=list=>`당신은 한국어-일본어 한자 사전입니다. 아래 각 줄에는 일본어 한자의 한국식 훈음("뜻 음")이 적혀 있습니다. 줄마다 해당하는 한자를 찾아 JSON 배열로만 답하세요.

- 후보마다 한국식 표준 훈음을 mean, on에 적으세요.
- 알 수 없으면 candidates를 빈 배열로 두세요. 추측으로 지어내지 마세요.
- 입력 줄 순서와 같은 순서로, 각 줄의 원문을 q에 그대로 적으세요.
형식 예: [{"q":"불 화","candidates":[{"ch":"火","mean":"불","on":"화","words":[{"w":"火事","r":"かじ"}]}]}]
입력:
${list.map(x=>x.q).join('\n')}`;

const readPrompt=ws=>`다음 일본어 단어 각각의 히라가나 읽기를 알려 주세요. 단어 전체를 한 번에 읽는 가장 일반적인 읽기를 히라가나로만 적으세요(가타카나·로마자·한국어 금지). 읽기를 잘 모르는 단어는 r을 빈 문자열로 두세요. 입력 순서대로 JSON 배열로만 답하세요. 형식: [{"w":"火事","r":"かじ"}]

const Readings=(function(){
  const busy=new Set(),failed=new Map();
  const wanted=w=>w&&w.w&&!w.r&&!busy.has(w.w)&&!(failed.get(w.w)>Date.now()-60000);
  const refresh=()=>{try{refreshWordViews();}catch(e){}};
  async function ensure(ks){
    const list=[...new Set((ks||[]).filter(Boolean).flatMap(k=>k.words.filter(wanted).map(w=>w.w)))];
    if(!list.length) return;
    list.forEach(w=>busy.add(w)); refresh();
    try{
      for(let i=0;i<list.length;i+=30){
        const part=list.slice(i,i+30); let arr=null;
        try{ arr=await askJson(readPrompt(part)); }
        catch(e){ part.forEach(w=>{failed.set(w,Date.now());busy.delete(w);}); refresh(); if(e&&e.code==='rate_limited') break; continue; }
        const map=new Map(); (Array.isArray(arr)?arr:[]).forEach(x=>{const r=cleanReading(x&&x.r); if(r&&x.w) map.set(String(x.w),r);});
        const touched=new Set();
        S.books.forEach(b=>b.kanji.forEach(k=>k.words.forEach(w=>{ if(!w.r&&map.has(w.w)){w.r=map.get(w.w);touched.add(b.id);} })));
        part.forEach(w=>{ if(!map.has(w)) failed.set(w,Date.now()); busy.delete(w); });
        touched.forEach(id=>persist(id)); refresh();
      }
    } finally { list.forEach(w=>busy.delete(w)); refresh(); }
  }
  const note=k=>{
    if(!k||!k.words.some(w=>!w.r)) return '';
    if(k.words.some(w=>!w.r&&busy.has(w.w))) return '<p class="muted rdhint">히라가나 읽기를 불러오는 중…</p>';
    if(k.words.some(w=>!w.r&&failed.has(w.w))) return '<p class="muted rdhint">읽기를 불러오지 못했어요. 이 창을 다시 열면 다시 시도해요.</p>';
    return '';
  };
  return {ensure,note};
})();

const camPickPrompt=(ch,ctx)=>`일본어 한자 '${ch}'의 한국식 표준 훈음(뜻은 mean, 음은 on)과, 이 한자가 들어간 일본어 단어 3개를 알려 주세요.${ctx?` 사진 속 문장 「${ctx}」에 이 한자가 들어간 단어가 있으면 그 단어를 첫 번째로 넣으세요.`:''} 단어마다 이 한자가 반드시 들어 있어야 하고, w에는 일본어 표기를, r에는 단어 전체의 히라가나 읽기를 적으세요. 너무 어렵지 않은 단어를 고르세요. JSON 객체로만 답하세요. 형식: {"ch":"火","mean":"불","on":"화","words":[{"w":"火事","r":"かじ"}]}`;

function shrinkImage(url,max){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*k)),h=Math.max(1,Math.round(img.naturalHeight*k));
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d');
      x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      c.toBlob(b=>b?res(b):rej({code:'bad_image'}),'image/jpeg',.86);
    };
    img.onerror=()=>rej({code:'bad_image'});
    img.src=url;
  });
}

/* 뜻은 대충 비슷하면 정답: 같음 / 서로 포함 / 앞 두 글자 이상 같음, 그래도 아니면 Claude에게 물어봐요 */
function similar(a,b){
  const n=norm(a); if(!n) return false;
  return alts(b).some(t=>{ if(n===t||n.includes(t)||t.includes(n)) return true; let i=0; while(i<n.length&&i<t.length&&n[i]===t[i]) i++; return i>=2; });
}
async function judgeMeaning(k,ans){
  try{
    const sm=await claude.use('sample'); if(!sm) return false;
    const r=await Promise.race([
      sm(`한자 '${k.ch}'의 정답 뜻(훈)은 '${k.mean}'입니다. 학생이 쓴 뜻은 '${ans}'입니다. 학생의 뜻이 정답과 같거나 대략 비슷한 의미이면 YES, 아니면 NO 한 단어로만 답하세요.`,{modelTier:'quick'}),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),12000))
    ]);
    return /^\s*YES/i.test((r&&r.text)||'');
  }catch(e){return false;}
}
async function submitGuess(){
  if(!ses||ses.phase!=='ask'||ses.judging) return;
  const k=curQ(),qi=ses.i,raw=$('#a-ans').value.trim(),parts=raw.split(/\s+/).filter(Boolean),err=$('#a-err');
  if(parts.length<2){ err.textContent='뜻과 음을 띄어 써 주세요. 예) 불 화'; $('#a-ans').focus(); return; }
  err.textContent='';
  const on=parts[parts.length-1],mean=parts.slice(0,-1).join(' '),oko=matchField(on,k.on);
  let okm=similar(mean,k.mean),exact=matchField(mean,k.mean);
  if(!okm&&oko){
    ses.judging=true; const b=$('#subbtn'); b.disabled=true; b.textContent='뜻 확인 중…';
    okm=await judgeMeaning(k,mean); ses.judging=false;
    if(!ses||ses.i!==qi||ses.phase!=='ask') return;
    b.disabled=false; b.textContent='확인';
  }
  const ok=okm&&oko;
  finishGuess(ok,ok?(exact?'':`<p class="mine">내 답 “${esc(raw)}” · 뜻이 비슷해서 정답으로 쳤어요.</p>`):`<p class="mine">내 답 “${esc(raw)}” · 뜻 ${okm?'맞음':'다름'} · 음 ${oko?'맞음':'다름'}</p>`);
}

function makeCanvas(cv,ch){
  const wrap=cv.parentElement,ctx=cv.getContext('2d'); let W=0,strokes=[],cur=null,ghost=false,reveal=false,col={};
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function size(){
    const r=wrap.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,3); W=r.width; if(!W) return;
    cv.width=Math.round(W*d);cv.height=Math.round(W*d);ctx.setTransform(d,0,0,d,0,0);
    col={line:css('--line'),fg:css('--fg'),ghost:css('--ghost'),strong:css('--ghost-strong')}; draw();
  }
  function stroke(s,lw,c){
    c=c||ctx; if(!s.length) return; c.beginPath();
    if(s.length===1){c.arc(s[0].x,s[0].y,lw/2,0,6.2832);c.fill();return;}
    c.moveTo(s[0].x,s[0].y);
    for(let i=1;i<s.length-1;i++){const mx=(s[i].x+s[i+1].x)/2,my=(s[i].y+s[i+1].y)/2;c.quadraticCurveTo(s[i].x,s[i].y,mx,my);}
    const l=s[s.length-1]; c.lineTo(l.x,l.y); c.stroke();
  }
  function draw(){
    ctx.clearRect(0,0,W,W);
    ctx.save(); ctx.strokeStyle=col.line; ctx.lineWidth=1; ctx.setLineDash([5,5]); ctx.beginPath();
    ctx.moveTo(W/2,10);ctx.lineTo(W/2,W-10);ctx.moveTo(10,W/2);ctx.lineTo(W-10,W/2);ctx.stroke(); ctx.restore();
    if(ghost||reveal){ctx.save();ctx.font=`700 ${W*0.78}px ${KFONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=reveal?col.strong:col.ghost;ctx.fillText(ch,W/2,W/2+W*0.04);ctx.restore();}
    const lw=Math.max(4,W*0.026); ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=lw;ctx.strokeStyle=col.fg;ctx.fillStyle=col.fg;
    strokes.forEach(s=>stroke(s,lw));
  }
  const pt=e=>{const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.addEventListener('pointerdown',e=>{if(reveal)return;cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);draw();e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!cur)return;cur.push(pt(e));draw();e.preventDefault();});
  const up=()=>{cur=null;};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);
  const ro=new ResizeObserver(size); ro.observe(wrap);

    undo(){if(reveal)return;strokes.pop();draw();}, clear(){if(reveal)return;strokes=[];draw();},
    hasInk(){return strokes.length>0;},
    snapshot(size){
      size=size||384;
      return new Promise(res=>{
        const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'),k=size/(W||size);
        x.fillStyle='#fff'; x.fillRect(0,0,size,size); x.scale(k,k);
        x.strokeStyle='#000'; x.fillStyle='#000'; x.lineCap='round'; x.lineJoin='round'; const lw=Math.max(4,(W||size)*0.03); x.lineWidth=lw;
        strokes.forEach(s=>stroke(s,lw,x)); c.toBlob(b=>res(b),'image/png');
      });
    },
    setGhost(v){ghost=v;draw();}, reveal(){reveal=true;draw();}, destroy(){ro.disconnect();}
  };
}

/* ---------- 一歩 splash: 앱을 켤 때 한 번 나오는 모션그래픽 ----------
   탑뷰: 사람이 한 걸음 → 발자국이 찍힘 → 발자국이 입자로 흩어졌다가 一歩로 모임 → 앱으로 전환.
   모든 장면은 시간 t(초)만으로 그려지는 순수 함수라서, 프레임이 건너뛰어도 어긋나지 않아요. */
const Splash=(function(){
  const TAU=Math.PI*2;
  const UIFONT='"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
  const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
  const lerp=(a,b,k)=>a+(b-a)*k;
  const sstep=(a,b,v)=>{const k=clamp((v-a)/(b-a));return k*k*(3-2*k);};
  const eIO3=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const eIO2=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const eO3=k=>1-Math.pow(1-k,3);
  const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

  /* ----- colors (읽어 온 테마 토큰 그대로 사용) ----- */
  const hex=s=>{
    s=String(s||'').trim();
    let m=/^#([0-9a-f]{3})$/i.exec(s);
    if(m){const h=m[1];return[parseInt(h[0]+h[0],16),parseInt(h[1]+h[1],16),parseInt(h[2]+h[2],16)];}
    m=/^#([0-9a-f]{6})/i.exec(s);
    if(m){const n=parseInt(m[1],16);return[n>>16&255,n>>8&255,n&255];}
    m=/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i.exec(s);
    if(m)return[+m[1],+m[2],+m[3]];
    return[128,128,128];
  };
  const mixc=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
  const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${Math.round(clamp(a)*1000)/1000})`;
  function palette(){
    const cs=getComputedStyle(document.documentElement),g=n=>hex(cs.getPropertyValue(n));
    const p={bg:g('--bg'),fg:g('--fg'),fg2:g('--fg-2'),ac:g('--point'),acSoft:g('--accent-soft')};
    p.dark=(p.bg[0]+p.bg[1]+p.bg[2])/3<110;
    p.body=p.dark?mixc(p.fg,p.bg,.18):p.fg;      // 옷
    p.hand=mixc(p.ac,p.bg,.4);
    p.hair=p.ac;                                   // 머리는 포인트 색
    return p;
  }

  /* ----- shapes ----- */
  /* 오른발 밑창 윤곽. 단위=발 길이, 발끝이 위(-0.5), 뒤꿈치가 아래(+0.5) */
  function solePath(c){
    c.beginPath();
    c.moveTo(.02,-.5);
    c.bezierCurveTo(.17,-.5,.215,-.31,.205,-.17);
    c.bezierCurveTo(.198,-.05,.165,.08,.152,.22);
    c.bezierCurveTo(.16,.37,.12,.5,0,.5);
    c.bezierCurveTo(-.12,.5,-.158,.37,-.13,.24);
    c.bezierCurveTo(-.12,.14,-.05,.1,-.04,0);
    c.bezierCurveTo(-.03,-.08,-.21,-.1,-.21,-.23);
    c.bezierCurveTo(-.21,-.4,-.11,-.5,.02,-.5);
    c.closePath();
  }
  function treads(c){
    c.lineCap='round';c.lineWidth=.02;c.strokeStyle='#000';
    for(const y of[-.4,-.31,-.22,-.13]){c.beginPath();c.moveTo(-.19,y+.03);c.quadraticCurveTo(0,y-.04,.19,y+.03);c.stroke();}
    for(const y of[.29,.37,.45]){c.beginPath();c.moveTo(-.1,y+.02);c.quadraticCurveTo(0,y-.03,.1,y+.02);c.stroke();}
  }
  function printSprite(Lpx,dpr,pal){
    const w=Math.ceil(Lpx*.62*dpr),h=Math.ceil(Lpx*1.12*dpr);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const c=cv.getContext('2d');
    c.translate(w/2,h/2);c.scale(Lpx*dpr,Lpx*dpr);
    c.fillStyle=css(pal.ac);solePath(c);c.fill();
    c.globalCompositeOperation='destination-out';treads(c);
    return{cv,w,h};
  }
  function rr(c,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
  }
  function blob(c,x,y,rx,ry,rot,col,a){
    c.save();c.translate(x,y);c.rotate(rot);c.scale(rx,ry);
    const g=c.createRadialGradient(0,0,0,0,0,1);
    g.addColorStop(0,css(col,a));g.addColorStop(.55,css(col,a*.75));g.addColorStop(1,css(col,0));
    c.fillStyle=g;c.beginPath();c.arc(0,0,1,0,TAU);c.fill();c.restore();
  }

  /* ----- layout: 화면 크기에서 모든 치수를 계산 ----- */
  function layout(W,H){
    const S=Math.min(.78*W,.55*H);          // 1m ≈ S px (사람 크기 기준)
    const F=Math.min(.36*W,.19*H,168);      // 一歩 글자 크기
    const Ls=.29*S;                          // 신발 길이
    return{W,H,S,F,Ls,ax:W/2,ay:H*.44,Z:1.25*F/Ls};
  }

  /* ----- 걸음 동작 (탑뷰). 월드 좌표: 발자국 중심=(0,0), 앞=위(-y) ----- */
  function pose(t,L){
    const S=L.S,s=.62*S,d=.085*S;
    const e=eIO3(clamp((t-.70)/.70));                       // 오른발 스윙 0.70→1.40
    const lift=Math.pow(Math.sin(Math.PI*clamp((t-.58)/.82)),.9);
    const eb=eIO2(clamp((t-.78)/.72));                      // 몸이 따라감
    const ant=Math.sin(Math.PI*clamp((t-.38)/.42));         // 출발 전 살짝 뒤로 실리는 체중
    const sw=eIO2(clamp((t-.66)/.84)),rest=sstep(1.5,2.1,t);
    const tw=.12*Math.sin(Math.PI*clamp((t-.62)/.9));       // 어깨 비틀기
    return{
      bx:-d, by:lerp(s,s/2,eb)+.022*S*ant-.05*S*sstep(1.65,2.2,t),
      tw, aL:sw*(1-.3*rest), aR:-sw*(1-.3*rest), ha:-.6*tw+.025*Math.sin(t*3),
      rf:{x:0,y:lerp(s,0,e),lift}, lf:{x:-2*d,y:s,lift:0}
    };
  }
  function shoe(c,f,side,L,pal){
    const k=L.Ls*(1+.16*f.lift);
    c.save();c.translate(f.x,f.y);c.rotate(side*.05);c.scale(side*k,k);
    solePath(c);c.fillStyle=css(mixc(pal.fg,pal.bg,.5));c.fill();            // 밑창 테두리
    c.save();c.scale(.84,.88);solePath(c);c.fillStyle=css(pal.fg);c.fill();c.restore();   // 갑피
    c.strokeStyle=css(pal.acSoft,.9);c.lineWidth=.03;c.lineCap='round';
    for(const y of[-.16,-.105,-.05]){c.beginPath();c.moveTo(-.065,y);c.lineTo(.065,y);c.stroke();}
    c.fillStyle=css(pal.ac);rr(c,-.05,.385,.1,.05,.022);c.fill();
    c.restore();
  }
  function paintPerson(c,P,pal,L){
    const S=L.S,sh=pal.dark?[0,0,0]:pal.fg,sk=pal.dark?1.7:1;
    /* 그림자 (빛이 왼쪽 위에서 와서 오른쪽 아래로) */
    blob(c,P.bx+.06*S,P.by+.085*S,.29*S,.15*S,P.tw,sh,.20*sk);
    blob(c,P.bx+.085*S,P.by+.105*S,.12*S,.14*S,0,sh,.15*sk);
    for(const f of[P.lf,P.rf]){
      const o=.02*S+f.lift*.07*S,g=1+.12*f.lift;
      blob(c,f.x+o,f.y+o*1.35,.075*S*g,.17*S*g,0,sh,(.22-.08*f.lift)*sk);
    }
    shoe(c,P.lf,-1,L,pal);shoe(c,P.rf,1,L,pal);
    /* 팔 + 몸통 */
    c.save();c.translate(P.bx,P.by);c.rotate(P.tw);
    const arm=css(mixc(pal.body,pal.bg,.28));
    for(const sd of[-1,1]){
      const a=sd<0?P.aL:P.aR,hx=sd*.27*S,hy=-a*.21*S;
      c.lineCap='round';c.strokeStyle=arm;c.lineWidth=.085*S;
      c.beginPath();c.moveTo(sd*.2*S,-.01*S);c.quadraticCurveTo(sd*.31*S,hy*.45-.01*S,hx,hy);c.stroke();
      c.fillStyle=css(pal.hand);c.beginPath();c.arc(hx,hy,.047*S,0,TAU);c.fill();
    }
    rr(c,-.235*S,-.105*S,.47*S,.21*S,.1*S);c.fillStyle=css(pal.body);c.fill();
    rr(c,-.2*S,-.088*S,.4*S,.06*S,.03*S);c.fillStyle=css(mixc(pal.body,[255,255,255],.35),.5);c.fill();
    c.restore();
    /* 머리 */
    c.save();c.translate(P.bx,P.by-.012*S);c.rotate(P.ha);
    c.fillStyle=css(pal.hand);
    for(const sd of[-1,1]){c.beginPath();c.ellipse(sd*.088*S,.004*S,.018*S,.03*S,0,0,TAU);c.fill();}
    c.fillStyle=css(pal.hair);c.beginPath();c.ellipse(0,0,.093*S,.115*S,0,0,TAU);c.fill();
    c.fillStyle=css(mixc(pal.hair,[255,255,255],.5),.5);c.beginPath();c.ellipse(-.026*S,-.03*S,.044*S,.06*S,-.4,0,TAU);c.fill();
    c.restore();
  }

  /* 모래 문양처럼 길게 그은 선들. 발자국이 찍히면 선이 양옆으로 갈라져요. */
  function groundLines(c,L,z,press,col){
    const S=L.S,gap=.072*S;
    const x0=-L.ax/z,x1=(L.W-L.ax)/z,y0=-L.ay/z-10,y1=(L.H-L.ay)/z+10;
    const i0=Math.floor(x0/gap)-1,i1=Math.ceil(x1/gap)+1;
    const a=.19*S,b=.40*S,g=1.15*press;
    c.lineWidth=1.25/z;c.strokeStyle=col;c.lineJoin='round';c.beginPath();
    for(let i=i0;i<=i1;i++){
      const bx=(i+.5)*gap;let first=true;
      for(let y=y0;y<=y1;y+=9){
        const q=(bx/a)*(bx/a)+(y/b)*(y/b);
        const x=bx*(1+g*Math.exp(-q))+.0035*S*Math.sin(y/(.11*S)+i*1.7);
        if(first){c.moveTo(x,y);first=false;}else c.lineTo(x,y);
      }
    }
    c.stroke();
  }

  /* ----- 글자 ----- */
  function drawGlyphs(c,L,pal,alpha,sc){
    c.save();c.translate(L.ax,L.ay);c.scale(sc,sc);c.globalAlpha=alpha;
    c.textAlign='center';c.textBaseline='middle';c.font=`700 ${L.F}px ${KFONT}`;
    c.fillStyle=css(pal.ac);c.fillText('一',-L.F*.53,0);
    c.fillStyle=css(pal.fg);c.fillText('歩',L.F*.53,0);
    c.restore();
  }
  function drawReading(c,L,pal,v){
    const kana=['い','っ','ぽ'],size=Math.max(14,L.F*.13),y=L.ay+L.F*.78;
    c.save();c.textAlign='center';c.textBaseline='middle';c.fillStyle=css(pal.fg2);
    c.font=`700 ${size}px ${KFONT}`;
    kana.forEach((g,i)=>{
      const k=clamp((v-i*.07)/.4);if(k<=0)return;
      const e=eO3(k);c.globalAlpha=e;c.fillText(g,L.ax+(i-1)*size*.95,y+(1-e)*7);
    });
    const kt=clamp((v-.25)/.45);
    if(kt>0){
      const e=eO3(kt);c.globalAlpha=e;c.font=`500 ${Math.max(13,L.F*.105)}px ${UIFONT}`;
      c.fillText('한 걸음씩, 한자',L.ax,y+size*2.15+(1-e)*6);
    }
    c.restore();
  }

  /* ----- 입자: 발자국의 픽셀 → 一歩 글자의 픽셀 ----- */
  function sample(d,w,h,x0,y0,step,rand,tag){
    const out=[];
    for(let gy=0;gy<h;gy+=step)for(let gx=0;gx<w;gx+=step){
      const px=Math.min(w-1,(gx+rand()*step)|0),py=Math.min(h-1,(gy+rand()*step)|0);
      if(d[(py*w+px)*4+3]>110)out.push([x0+px+rand(),y0+py+rand(),tag]);
    }
    return out;
  }
  function area(d){let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>110)n++;return n;}
  function fit(pts,N,rand){
    if(!pts.length)return null;
    while(pts.length<N){const p=pts[(rand()*pts.length)|0];pts.push([p[0]+(rand()-.5)*1.4,p[1]+(rand()-.5)*1.4,p[2]]);}
    if(pts.length>N){
      for(let i=pts.length-1;i>0;i--){const j=(rand()*(i+1))|0,t=pts[i];pts[i]=pts[j];pts[j]=t;}
      pts.length=N;
    }
    return pts;
  }
  /* x로 세로 띠를 나눈 뒤 띠 안에서는 y순으로 정렬 → 두 모양의 같은 위치끼리 짝이 돼서 흐름이 자연스러워요 */
  function order(pts,slices){
    pts.sort((p,q)=>p[0]-q[0]);
    const n=pts.length,per=Math.ceil(n/slices),out=[];
    for(let s=0;s<n;s+=per){const part=pts.slice(s,s+per);part.sort((p,q)=>p[1]-q[1]);for(const p of part)out.push(p);}
    return out;
  }
  function prepare(S){
    const L=S.L,pal=S.pal,rand=rng(20260),N=S.N;
    const Lp=L.Ls*L.Z,pw=Math.ceil(Lp*.62)+2,ph=Math.ceil(Lp*1.12)+2;
    const px0=Math.round(L.ax-pw/2),py0=Math.round(L.ay-ph/2);
    const cp=document.createElement('canvas');cp.width=pw;cp.height=ph;
    const xp=cp.getContext('2d',{willReadFrequently:true});
    xp.drawImage(S.sprite.cv,(L.ax-px0)-Lp*.31,(L.ay-py0)-Lp*.56,Lp*.62,Lp*1.12);
    const dP=xp.getImageData(0,0,pw,ph).data;
    const tw=Math.ceil(L.F*2.4),th=Math.ceil(L.F*1.5),tx0=Math.round(L.ax-tw/2),ty0=Math.round(L.ay-th/2);
    const ct=document.createElement('canvas');ct.width=tw;ct.height=th;
    const xt=ct.getContext('2d',{willReadFrequently:true});
    const glyph=(ch,off)=>{
      xt.setTransform(1,0,0,1,0,0);xt.clearRect(0,0,tw,th);
      xt.fillStyle='#000';xt.textAlign='center';xt.textBaseline='middle';xt.font=`700 ${L.F}px ${KFONT}`;
      xt.fillText(ch,(L.ax-tx0)+off,L.ay-ty0);
      return xt.getImageData(0,0,tw,th).data;
    };
    const dI=glyph('一',-L.F*.53),dH=glyph('歩',L.F*.53);
    const aP=area(dP),aI=area(dI),aH=area(dH);
    if(aP<200||aI+aH<400)return null;
    const stepP=Math.sqrt(aP/N),stepT=Math.sqrt((aI+aH)/N);
    const A=fit(sample(dP,pw,ph,px0,py0,stepP,rand,0),N,rand);
    const B=fit(sample(dI,tw,th,tx0,ty0,stepT,rand,0).concat(sample(dH,tw,th,tx0,ty0,stepT,rand,1)),N,rand);
    if(!A||!B)return null;
    const a=order(A,14),b=order(B,14);
    const P={n:N,sx:new Float32Array(N),sy:new Float32Array(N),ex:new Float32Array(N),ey:new Float32Array(N),
      dl:new Float32Array(N),du:new Float32Array(N),ph:new Float32Array(N),am:new Float32Array(N),rs:new Float32Array(N),tg:new Uint8Array(N)};
    for(let i=0;i<N;i++){
      P.sx[i]=a[i][0];P.sy[i]=a[i][1];P.ex[i]=b[i][0];P.ey[i]=b[i][1];P.tg[i]=b[i][2];
      P.dl[i]=rand()*.3;P.du[i]=.7+rand()*.1;P.ph[i]=rand()*TAU;P.am[i]=6+rand()*26;P.rs[i]=1+rand()*.5;
    }
    S.bx=new Float32Array(N);S.by=new Float32Array(N);S.br=new Float32Array(N);S.bb=new Uint8Array(N);
    S.cols=[css(pal.ac),css(mixc(pal.ac,pal.fg,1/3)),css(mixc(pal.ac,pal.fg,2/3)),css(pal.fg)];
    return P;
  }
  function drawParticles(S,u){
    const c=S.c,P=S.P,L=S.L,n=P.n,X=S.bx,Y=S.by,R=S.br,B=S.bb,sz=Math.max(.85,L.F/140);
    const fade=1-sstep(.95,1.3,u);
    if(fade<=.003)return;
    for(let i=0;i<n;i++){
      const k=clamp((u-P.dl[i])/P.du[i]),e=eIO3(k),am=P.am[i]*Math.sin(Math.PI*k)*(L.F/140),a=P.ph[i]+k*3.2;
      X[i]=lerp(P.sx[i],P.ex[i],e)+Math.cos(a)*am;
      Y[i]=lerp(P.sy[i],P.ey[i],e)+Math.sin(a)*am;
      R[i]=P.rs[i]*sz*(1+.7*(1-sstep(0,.25,k)));
      B[i]=P.tg[i]?Math.min(3,(e*4)|0):0;
    }
    c.save();c.globalAlpha=fade;
    for(let b=0;b<4;b++){
      c.fillStyle=S.cols[b];c.beginPath();
      for(let i=0;i<n;i++)if(B[i]===b){c.moveTo(X[i]+R[i],Y[i]);c.arc(X[i],Y[i],R[i],0,TAU);}
      c.fill();
    }
    c.restore();
  }

  /* ----- 한 프레임 ----- */
  const T_MORPH=2.65, T_HOLD=2.45;
  function draw(S,t){
    const c=S.c,L=S.L,pal=S.pal,dpr=S.dpr,W=L.W,H=L.H;
    const u=S.ready?t-S.tM:-9;                       // 입자 변신 시작 후 경과 시간
    const z=lerp(1,L.Z,eIO3(clamp((t-1.95)/.6)));    // 발자국 쪽으로 카메라가 다가감
    const bump=t>1.4?2.6*Math.exp(-(t-1.4)*10)*Math.sin((t-1.4)*46):0;   // 착지 충격
    c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);

    /* 바닥 선 */
    const la=.12*sstep(0,.7,t)*(1-.55*sstep(0,.8,u));
    if(la>.003){
      c.save();c.translate(L.ax,L.ay+bump);c.scale(z,z);
      groundLines(c,L,z,eO3(clamp((t-1.4)/.55)),css(pal.fg,la*.7));
      c.restore();
    }
    /* 가장자리를 살짝 눌러 주는 비네트 */
    const vg=c.createRadialGradient(W/2,H*.45,Math.min(W,H)*.3,W/2,H*.45,Math.max(W,H)*.8);
    const vc=pal.dark?[0,0,0]:pal.fg;
    vg.addColorStop(0,css(vc,0));vg.addColorStop(1,css(vc,(pal.dark?.3:.07)*sstep(0,.8,t)));
    c.fillStyle=vg;c.fillRect(0,0,W,H);

    /* 발자국 · 물결 · 먼지 */
    const kst=t-1.4;
    if(kst>0&&u<.4){
      c.save();c.translate(L.ax,L.ay+bump);c.scale(z,z);
      const a=clamp(kst/.07)*(1-sstep(.04,.28,u)),sc=1+.2*(1-eO3(clamp(kst/.36)));
      if(a>.003){
        c.save();c.globalAlpha=a;c.scale(sc,sc);c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
        c.drawImage(S.sprite.cv,-L.Ls*.31,-L.Ls*.56,L.Ls*.62,L.Ls*1.12);c.restore();
      }
      const kr=kst/.85;
      if(kr<1){
        c.strokeStyle=css(pal.ac,.55*Math.pow(1-kr,1.6));c.lineWidth=L.S*.011*(1-.5*kr);
        c.beginPath();c.arc(0,0,L.S*(.09+.36*eO3(kr)),0,TAU);c.stroke();
      }
      for(const d of S.dust){
        const kd=kst/d.life;if(kd>=1)continue;
        const r=d.v*L.S*eO3(kd)*d.life;
        c.fillStyle=css(pal.fg2,.3*Math.pow(1-kd,1.2));
        c.beginPath();c.arc(Math.cos(d.a)*r,Math.sin(d.a)*r*.9,d.r*L.S*(1-.4*kd),0,TAU);c.fill();
      }
      c.restore();
    }

    /* 사람 (페이드 중에는 한 덩어리로 투명도를 줘야 겹친 부분이 비치지 않아요) */
    const pa=sstep(0,.45,t)*(1-sstep(1.65,2.15,t));
    if(pa>.004){
      const P=pose(t,L);
      if(pa>.99){
        c.save();c.translate(L.ax,L.ay+bump);c.scale(z,z);paintPerson(c,P,pal,L);c.restore();
      }else{
        const lay=S.layer,lx=-.55*L.S,ly=-.3*L.S,rw=.95*L.S,rh=1.22*L.S,lc=lay.c;
        lc.setTransform(1,0,0,1,0,0);lc.clearRect(0,0,lay.cv.width,lay.cv.height);
        lc.setTransform(dpr*z,0,0,dpr*z,-dpr*z*lx,-dpr*z*ly);paintPerson(lc,P,pal,L);
        c.save();c.globalAlpha=pa;
        c.drawImage(lay.cv,0,0,dpr*z*rw,dpr*z*rh,L.ax+z*lx,L.ay+z*ly,z*rw,z*rh);
        c.restore();
      }
    }

    /* 입자 → 글자 */
    if(S.P&&u>=0)drawParticles(S,u);
    const tin=S.P?.95:0,ta=sstep(tin,tin+.35,u);
    if(ta>.003)drawGlyphs(c,L,pal,ta,1+.035*Math.sin(Math.PI*clamp((u-tin-.35)/.5)));
    if(u>tin+.35)drawReading(c,L,pal,u-tin-.35);
  }

  /* ----- 재생 ----- */
  let cur=null;
  function play(){
    if(cur)return;
    const app=document.getElementById('app');
    const reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
    const el=document.createElement('div');
    el.className='splash';el.setAttribute('role','img');el.setAttribute('aria-label','一歩');
    const col=document.createElement('div');col.className='sp-col';
    const cv=document.createElement('canvas');col.appendChild(cv);el.appendChild(col);
    const c=cv.getContext&&cv.getContext('2d');
    if(!c)return;
    document.body.appendChild(el);
    app.inert=true;

    const S={c,cv,L:null,pal:palette(),dpr:1,ready:false,tM:1e9,t0:performance.now(),done:false,exiting:false,
      sprite:null,P:null,layer:null,dust:[],N:1800,raf:0,tid:0,safety:0};
    cur=S;
    const lowEnd=(navigator.hardwareConcurrency||8)<=4;

    function setup(){
      S.cw=col.clientWidth;S.ch=col.clientHeight;
      const W=Math.max(200,S.cw),H=Math.max(300,S.ch);
      S.dpr=Math.min(2,window.devicePixelRatio||1);
      cv.width=Math.round(W*S.dpr);cv.height=Math.round(H*S.dpr);
      S.L=layout(W,H);
      S.N=Math.round(Math.min(2600,Math.max(1400,W*H/140))*(lowEnd?.7:1));
      S.sprite=printSprite(S.L.Ls*S.L.Z,S.dpr,S.pal);
      const lc=document.createElement('canvas');
      lc.width=Math.ceil(1.25*.95*S.L.S*S.dpr);lc.height=Math.ceil(1.25*1.22*S.L.S*S.dpr);
      S.layer={cv:lc,c:lc.getContext('2d')};
      const rand=rng(11);
      S.dust=Array.from({length:18},()=>({a:rand()*TAU,v:.18+.34*rand(),r:.006+.01*rand(),life:.5+.45*rand()}));
      if(S.ready){try{S.P=prepare(S);}catch(e){S.P=null;}}
    }
    function finish(){
      if(S.done)return;S.done=true;
      cancelAnimationFrame(S.raf);clearTimeout(S.tid);clearTimeout(S.safety);
      document.removeEventListener('keydown',onKey);
      el.remove();app.inert=false;cur=null;
      setTimeout(()=>app.classList.remove('appin'),900);
    }
    function exit(fast){
      if(S.exiting||S.done)return;S.exiting=true;
      if(fast)el.classList.add('fast');
      el.classList.add('out');
      app.inert=false;app.classList.add('appin');
      app.addEventListener('animationend',()=>app.classList.remove('appin'),{once:true});
      S.tid=setTimeout(finish,fast?340:660);
    }
    function onKey(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' ')exit(true);}
    el.addEventListener('pointerdown',()=>exit(true));
    document.addEventListener('keydown',onKey);
    S.safety=setTimeout(finish,14000);

    function frame(now){
      if(S.done)return;
      S.raf=requestAnimationFrame(frame);
      try{
        if(col.clientWidth!==S.cw||col.clientHeight!==S.ch)setup();
        const t=(now-S.t0)/1000;
        draw(S,t);
        if(!S.exiting&&S.ready&&t>=S.tM+T_HOLD)exit(false);
      }catch(e){finish();}
    }
    try{
      setup();
      const fonts=document.fonts&&document.fonts.load?Promise.all([
        document.fonts.load('700 100px "Noto Serif JP"','一歩いっぽ'),
        document.fonts.load('500 14px "Noto Sans KR"','한 걸음씩, 한자')
      ]).catch(()=>{}):Promise.resolve();
      /* 글꼴이 늦게 도착하면, 변신이 시작되기 전에 한 번 더 입자를 만들어요 (입자 모양과 완성 글자가 어긋나지 않게) */
      fonts.then(()=>{
        S.fontsDone=true;
        if(S.done||!S.ready||S.P&&S.fontsSeen)return;
        if((performance.now()-S.t0)/1000<S.tM-.1){try{S.P=prepare(S);}catch(e){}}
      });
      Promise.race([fonts,new Promise(r=>setTimeout(r,1600))]).then(()=>{
        if(S.done)return;
        try{S.P=prepare(S);}catch(e){S.P=null;}
        S.tM=Math.max(T_MORPH,(performance.now()-S.t0)/1000);S.ready=true;S.fontsSeen=S.fontsDone===true;
        if(reduced){                                  // 움직임 줄이기: 완성된 타이틀만 잠깐 보여 줘요
          S.tM=0;draw(S,9);S.tid=setTimeout(()=>exit(false),1100);
        }
      });
      if(!reduced)S.raf=requestAnimationFrame(frame);
    }catch(e){finish();}
  }
  return{play};
})();

/* ---------- boot ---------- */
(function boot(){
  try{
    const s=JSON.parse(localStorage.getItem(LSK)||'null');
    if(s&&Array.isArray(s.books)&&s.books.length){S.books=s.books.map(cleanBook);S.active=s.active;}
  }catch(e){}
  if(!S.books.length){S.books=[seedBook()];S.active='n1';}
  if(!S.books.find(b=>b.id===S.active)) S.active=S.books[0].id;
  MIG.forEach(id=>dirty.add(id)); MIG.clear(); lsSet();
  render(); initRemote();
  try{Splash.play();}catch(e){}
})();
</script>
